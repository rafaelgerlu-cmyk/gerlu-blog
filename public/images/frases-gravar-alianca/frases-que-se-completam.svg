<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Exemplo de frase dividida entre as duas alianças: Eu e você / Para sempre</title>
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2DA92"/><stop offset=".45" stop-color="#D4AF55"/><stop offset="1" stop-color="#A9832F"/>
    </linearGradient>
  </defs>
  <rect width="900" height="352" rx="18" fill="#FBF7EF"/>
  <text x="40" y="58" font-size="22" font-weight="700" fill="#2A2420">Uma frase, duas alianças</text>
  <text x="40" y="84" font-size="15" fill="#6E6358">Parte interna da aliança, vista aberta</text>
  
  <text x="40" y="158" font-size="16" font-weight="600" fill="#6E6358">Aliança 1</text>
  <rect x="150" y="110" width="700" height="84" rx="42" fill="url(#ouro)"/>
  <rect x="156" y="116" width="688" height="72" rx="36" fill="none" stroke="#FFF3C9" stroke-opacity=".45" stroke-width="2"/>
  <text x="500" y="164.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#FFF1C2" fill-opacity=".7">Eu e você</text>
  <text x="500" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#6B4E14">Eu e você</text>
  <text x="40" y="274" font-size="16" font-weight="600" fill="#6E6358">Aliança 2</text>
  <rect x="150" y="226" width="700" height="84" rx="42" fill="url(#ouro)"/>
  <rect x="156" y="232" width="688" height="72" rx="36" fill="none" stroke="#FFF3C9" stroke-opacity=".45" stroke-width="2"/>
  <text x="500" y="280.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#FFF1C2" fill-opacity=".7">Para sempre</text>
  <text x="500" y="279" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#6B4E14">Para sempre</text>
  
</svg>
