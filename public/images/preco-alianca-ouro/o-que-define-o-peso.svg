<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>O que define o peso da aliança: largura, espessura, numeração e formato</title>
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2DA92"/><stop offset=".5" stop-color="#D4AF55"/><stop offset="1" stop-color="#A9832F"/>
    </linearGradient>
  </defs>
  <rect width="900" height="430" rx="18" fill="#FAF6ED"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#3D2E1F">O que define o peso da aliança</text>
  <text x="40" y="78" font-size="15" fill="#6E6358">Mais metal na peça significa mais ouro no cálculo — e preço maior.</text>

  <!-- 1. largura -->
  <rect x="40" y="104" width="190" height="290" rx="14" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
  <text x="135" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3D2E1F">Largura</text>
  <rect x="72" y="160" width="40" height="150" rx="6" fill="url(#ouro)"/>
  <text x="92" y="332" text-anchor="middle" font-size="14" fill="#6E6358">estreita</text>
  <rect x="140" y="160" width="76" height="150" rx="6" fill="url(#ouro)"/>
  <text x="178" y="332" text-anchor="middle" font-size="14" fill="#6E6358">larga</text>
  <text x="135" y="368" text-anchor="middle" font-size="14" fill="#6E6358">a faixa mais larga</text>
  <text x="135" y="386" text-anchor="middle" font-size="14" fill="#6E6358">usa mais ouro</text>

  <!-- 2. espessura -->
  <rect x="246" y="104" width="190" height="290" rx="14" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
  <text x="341" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3D2E1F">Espessura</text>
  <g>
    <ellipse cx="294" cy="215" rx="38" ry="38" fill="url(#ouro)"/><ellipse cx="294" cy="215" rx="30" ry="30" fill="#FFFDF9"/>
    <text x="294" y="278" text-anchor="middle" font-size="14" fill="#6E6358">fina</text>
    <ellipse cx="390" cy="215" rx="38" ry="38" fill="url(#ouro)"/><ellipse cx="390" cy="215" rx="20" ry="20" fill="#FFFDF9"/>
    <text x="390" y="278" text-anchor="middle" font-size="14" fill="#6E6358">grossa</text>
  </g>
  <text x="341" y="368" text-anchor="middle" font-size="14" fill="#6E6358">corte da aliança:</text>
  <text x="341" y="386" text-anchor="middle" font-size="14" fill="#6E6358">parede mais grossa pesa mais</text>

  <!-- 3. numeração -->
  <rect x="452" y="104" width="190" height="290" rx="14" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
  <text x="547" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3D2E1F">Numeração</text>
  <circle cx="508" cy="215" r="31" fill="none" stroke="url(#ouro)" stroke-width="13"/>
  <text x="508" y="278" text-anchor="middle" font-size="14" fill="#6E6358">aro 14</text>
  <circle cx="600" cy="215" r="43" fill="none" stroke="url(#ouro)" stroke-width="13"/>
  <text x="600" y="278" text-anchor="middle" font-size="14" fill="#6E6358">aro 26</text>
  <text x="547" y="368" text-anchor="middle" font-size="14" fill="#6E6358">aro maior = circunferência</text>
  <text x="547" y="386" text-anchor="middle" font-size="14" fill="#6E6358">maior = mais metal</text>

  <!-- 4. formato -->
  <rect x="658" y="104" width="202" height="290" rx="14" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
  <text x="759" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#3D2E1F">Formato</text>
  <rect x="694" y="184" width="54" height="62" rx="4" fill="url(#ouro)"/>
  <text x="721" y="278" text-anchor="middle" font-size="14" fill="#6E6358">reto</text>
  <path d="M770 246 v-32 a27 31 0 0 1 54 0 v32 z" fill="url(#ouro)"/>
  <text x="797" y="278" text-anchor="middle" font-size="14" fill="#6E6358">abaulado</text>
  <text x="759" y="368" text-anchor="middle" font-size="14" fill="#6E6358">perfil e relevo mudam</text>
  <text x="759" y="386" text-anchor="middle" font-size="14" fill="#6E6358">o peso final da peça</text>
</svg>
