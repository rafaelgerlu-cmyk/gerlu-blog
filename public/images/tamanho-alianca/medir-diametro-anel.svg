<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, system-ui, sans-serif">
  <title>Como medir o diâmetro interno de um anel com régua</title>
  <rect width="900" height="460" rx="18" fill="#FBF7EF"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CD7A"/><stop offset=".5" stop-color="#C9A24A"/><stop offset="1" stop-color="#9C7A2A"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2A2420"/></marker>
  </defs>
  <!-- anel visto de cima -->
  <circle cx="330" cy="190" r="138" fill="url(#g)"/>
  <circle cx="330" cy="190" r="114" fill="#FBF7EF"/>
  <!-- guias até a régua -->
  <line x1="216" y1="190" x2="216" y2="352" stroke="#A8842C" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="444" y1="190" x2="444" y2="352" stroke="#A8842C" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- seta do diâmetro interno -->
  <line x1="220" y1="190" x2="440" y2="190" stroke="#2A2420" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="270" y="138" width="120" height="32" rx="16" fill="#2A2420"/>
  <text x="330" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#FBF7EF">17,8 mm</text>
  <!-- régua (12,8 px por mm) -->
  <rect x="196" y="352" width="300" height="62" rx="6" fill="#FFFFFF" stroke="#CDBE9F" stroke-width="2"/>
  <g stroke="#6E6358" stroke-width="2"><line x1="216" y1="352" x2="216" y2="382"/><line x1="228.8" y1="352" x2="228.8" y2="366"/><line x1="241.6" y1="352" x2="241.6" y2="366"/><line x1="254.4" y1="352" x2="254.4" y2="366"/><line x1="267.2" y1="352" x2="267.2" y2="366"/><line x1="280" y1="352" x2="280" y2="374"/><line x1="292.8" y1="352" x2="292.8" y2="366"/><line x1="305.6" y1="352" x2="305.6" y2="366"/><line x1="318.4" y1="352" x2="318.4" y2="366"/><line x1="331.2" y1="352" x2="331.2" y2="366"/><line x1="344" y1="352" x2="344" y2="382"/><line x1="356.8" y1="352" x2="356.8" y2="366"/><line x1="369.6" y1="352" x2="369.6" y2="366"/><line x1="382.4" y1="352" x2="382.4" y2="366"/><line x1="395.2" y1="352" x2="395.2" y2="366"/><line x1="408" y1="352" x2="408" y2="374"/><line x1="420.8" y1="352" x2="420.8" y2="366"/><line x1="433.6" y1="352" x2="433.6" y2="366"/><line x1="446.4" y1="352" x2="446.4" y2="366"/><line x1="459.2" y1="352" x2="459.2" y2="366"/><line x1="472" y1="352" x2="472" y2="382"/><line x1="484.8" y1="352" x2="484.8" y2="366"/></g>
  <g font-size="13" fill="#6E6358" text-anchor="middle"><text x="216" y="402">0</text><text x="344" y="402">1 cm</text><text x="472" y="402">2 cm</text></g>
  <!-- explicações -->
  <text x="560" y="120" font-size="22" font-weight="700" fill="#2A2420">Meça por dentro</text>
  <text x="560" y="152" font-size="16" fill="#6E6358">De uma borda interna à outra,</text>
  <text x="560" y="176" font-size="16" fill="#6E6358">passando pelo centro do anel.</text>
  <circle cx="572" cy="232" r="12" fill="#2A2420"/>
  <path d="M566 232 L570 237 L579 227" fill="none" stroke="#FBF7EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="594" y="238" font-size="16" fill="#2A2420">Só o espaço vazio do meio</text>
  <circle cx="572" cy="274" r="12" fill="#B4432F"/>
  <path d="M567 269 L577 279 M577 269 L567 279" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="594" y="280" font-size="16" fill="#2A2420">Sem a espessura do metal</text>
  <rect x="560" y="318" width="290" height="70" rx="12" fill="#F1E6CC"/>
  <text x="578" y="347" font-size="15" fill="#7E6220">Exemplo: 17,8 mm de diâmetro</text>
  <text x="578" y="371" font-size="17" font-weight="700" fill="#2A2420">= aro 16 na tabela</text>
</svg>
