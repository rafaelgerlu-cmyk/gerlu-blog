<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Etapas da troca de ouro usado por aliança: teste, pesagem, cálculo e abatimento</title><defs>
  <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2DA92"/><stop offset=".5" stop-color="#D4AF55"/><stop offset="1" stop-color="#A9832F"/></linearGradient>
  <linearGradient id="velho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9C08A"/><stop offset="1" stop-color="#9C8350"/></linearGradient>
  <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C615F"/></marker>
</defs>
  <rect width="900" height="400" rx="18" fill="#FAF6ED"/>
  <text x="40" y="56" font-size="22" font-weight="700" fill="#3D2E1F">Como funciona a troca</text>
  <circle cx="128" cy="170" r="66" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
    <g transform="translate(128 170)"><circle cx="-8" cy="-8" r="22" fill="none" stroke="#3D2E1F" stroke-width="6"/><path d="M8 8 L30 30" stroke="#3D2E1F" stroke-width="8" stroke-linecap="round"/><text x="-8" y="-1" text-anchor="middle" font-size="16" font-weight="700" fill="#7C615F">750</text></g>
    <circle cx="78" cy="116" r="17" fill="#7C615F"/><text x="78" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <text x="128" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#3D2E1F">Teste</text>
    <text x="128" y="308" text-anchor="middle" font-size="15" fill="#6E6358">confirma se é ouro</text>
    <text x="128" y="328" text-anchor="middle" font-size="15" fill="#6E6358">e qual o teor</text>
    <path d="M204 170 H266" stroke="#7C615F" stroke-width="4" stroke-linecap="round" marker-end="url(#seta)"/><circle cx="343" cy="170" r="66" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
    <g transform="translate(343 170)"><rect x="-38" y="10" width="76" height="26" rx="6" fill="#3D2E1F"/><rect x="-24" y="16" width="48" height="14" rx="3" fill="#BFE3C0"/><text x="0" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#3D2E1F">5,00 g</text><rect x="-32" y="-2" width="64" height="8" rx="3" fill="#6E6358"/><circle cx="-10" cy="-14" r="10" fill="none" stroke="url(#ouro)" stroke-width="5"/><circle cx="12" cy="-12" r="8" fill="url(#ouro)"/></g>
    <circle cx="293" cy="116" r="17" fill="#7C615F"/><text x="293" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <text x="343" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#3D2E1F">Pesagem</text>
    <text x="343" y="308" text-anchor="middle" font-size="15" fill="#6E6358">só o metal, sem</text>
    <text x="343" y="328" text-anchor="middle" font-size="15" fill="#6E6358">pedras e fechos</text>
    <path d="M419 170 H481" stroke="#7C615F" stroke-width="4" stroke-linecap="round" marker-end="url(#seta)"/><circle cx="558" cy="170" r="66" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
    <g transform="translate(558 170)"><rect x="-28" y="-36" width="56" height="72" rx="8" fill="#3D2E1F"/><rect x="-20" y="-28" width="40" height="16" rx="3" fill="#FFFDF9"/><rect x="-20" y="-4" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="-5" y="-4" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="10" y="-4" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="-20" y="10" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="-5" y="10" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="10" y="10" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="-20" y="24" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="-5" y="24" width="10" height="9" rx="2" fill="#CFC4B4"/><rect x="10" y="24" width="10" height="9" rx="2" fill="#D4AF55"/></g>
    <circle cx="508" cy="116" r="17" fill="#7C615F"/><text x="508" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <text x="558" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#3D2E1F">Cálculo</text>
    <text x="558" y="308" text-anchor="middle" font-size="15" fill="#6E6358">peso × teor ×</text>
    <text x="558" y="328" text-anchor="middle" font-size="15" fill="#6E6358">cotação do dia</text>
    <path d="M634 170 H696" stroke="#7C615F" stroke-width="4" stroke-linecap="round" marker-end="url(#seta)"/><circle cx="773" cy="170" r="66" fill="#FFFDF9" stroke="#EDE1CF" stroke-width="2"/>
    <g transform="translate(773 170)"><ellipse cx="-12" cy="4" rx="20" ry="25" fill="none" stroke="url(#ouro)" stroke-width="8"/><ellipse cx="14" cy="8" rx="18" ry="22" fill="none" stroke="url(#ouro)" stroke-width="7"/><path d="M14 -40 h30 l10 12 l-10 12 h-30 z" fill="#7C615F"/><text x="30" y="-24" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">−</text></g>
    <circle cx="723" cy="116" r="17" fill="#7C615F"/><text x="723" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
    <text x="773" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#3D2E1F">Abatimento</text>
    <text x="773" y="308" text-anchor="middle" font-size="15" fill="#6E6358">valor descontado</text>
    <text x="773" y="328" text-anchor="middle" font-size="15" fill="#6E6358">da aliança nova</text>
    
</svg>