<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Comparação de ouro puro em peças de 5 gramas: 3,75 g no ouro 18k e cerca de 2,9 g no ouro 14k</title><defs>
  <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2DA92"/><stop offset=".5" stop-color="#D4AF55"/><stop offset="1" stop-color="#A9832F"/></linearGradient>
  <linearGradient id="velho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9C08A"/><stop offset="1" stop-color="#9C8350"/></linearGradient>
  <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C615F"/></marker>
</defs>
  <rect width="900" height="330" rx="18" fill="#FAF6ED"/>
  <text x="40" y="56" font-size="22" font-weight="700" fill="#3D2E1F">Mesma peça de 5 g, teores diferentes</text>
  <text x="40" y="84" font-size="15" fill="#6E6358">A barra inteira representa os 5 gramas da peça; o dourado é o ouro puro.</text>
  
  <text x="40" y="150" font-size="18" font-weight="700" fill="#3D2E1F">Ouro 18k (750)</text>
  <rect x="300" y="120" width="520" height="46" rx="10" fill="#E9E1D2"/>
  <rect x="300" y="120" width="390" height="46" rx="10" fill="url(#ouro)"/>
  <text x="678" y="150" text-anchor="end" font-size="17" font-weight="700" fill="#5A410F">3,75 g de ouro puro</text>
  
  <text x="40" y="230" font-size="18" font-weight="700" fill="#3D2E1F">Ouro 14k (585)</text>
  <rect x="300" y="200" width="520" height="46" rx="10" fill="#E9E1D2"/>
  <rect x="300" y="200" width="304" height="46" rx="10" fill="url(#ouro)"/>
  <text x="592" y="230" text-anchor="end" font-size="17" font-weight="700" fill="#5A410F">≈ 2,9 g de ouro puro</text>
  <text x="300" y="296" font-size="14" fill="#6E6358">0 g</text><text x="820" y="296" text-anchor="end" font-size="14" fill="#6E6358">5 g</text>
</svg>